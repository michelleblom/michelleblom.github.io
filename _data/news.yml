
- date: November, 2025
  headline: "Honoured to have received the 2025 Ariel Liebman Impact Award for
our work on risk-limiting audits for preferential election, together with my
colleagues Alexander Ek, Damjan Vukcevic, Peter Stuckey, and Philip Stark." 

- date: August, 2025
  headline: "Work on [Large Neighbourhood Search for Long Term Open-Pit Mine Planning](https://pubsonline.informs.org/doi/abs/10.1287/inte.2024.0152) has been published in INFORMS Journal on Applied Analytics."

- date: July, 2025
  headline: "A summary of our work on risk-limiting audits for IRV elections using RAIRE has been published in the latest issue of [IEEE Uplink](https://r10.ieee.org/victorian/wp-content/uploads/sites/38/2025/07/IEEE_Victorial_Section_UPLINK_2025Vol.1.pdf). " 

- date: March, 2025
  headline: "Two of our papers were accepted at VOTING'25: [3+ Seat Risk-Limiting Audits for Single Transferable Vote Elections](https://arxiv.org/abs/2503.14803) and [Doing More With Less: Mismatch-Based Risk-Limiting Audits](https://arxiv.org/abs/2503.16104) " 

- date: December, 2024
  headline: "Honoured to have received the 2024 University of Melbourne Excellence Award for Interdiscplinary Research for my work on risk-limiting
audits for preferential elections. "

- date: December, 2024
  headline: "I was delighted to be able to discuss our work on post-election auditing at the ADM+S conference on the [fairness of elections in the age of
AI](https://www.admscentre.org.au/adms-hosts-usc-election-cybersecurity-initiative-to-consider-fair-elections-in-the-age-of-ai/)." 

- date: July, 2024
  headline: "Our work on improving the computational efficiency of AWAIRE post-election audits has been accepted to EVOTE-ID'24 in Tarragona, Spain!"

- date: July, 2024
  headline: "Honoured to have received the 2023 FEIT Excellence Award for Research for my work on risk limiting audits."

- date: October, 2023
  headline: "Honoured to have received the 2023 IEEE Cybersecurity Award for
Practice alongside Vanessa Teague, Philip Stark, and Mark Lindemann."

- date: April, 2023
  headline: "Our work on RLAs for two seat STV elections was presented at the VOTING'23 workshop in the Carribbean! This work presents improvements to our original methods, presented two years prior, allowing for more two seat STV elections to be audited and with fewer required ballot samples." 

- date: February 10, 2022
  headline: "Our work on risk limiting audits for Ranked Pairs elections has been
accepted to the VOTING'23 workshop. Joint work with Damjan Vukcevic, Peter
Stuckey, and Vanessa Teague."

- date: September 30, 2022
  headline: "Our work on using Dirichlet-Tree models for ballot-polling audits
of IRV elections is being presented today at the first International Workshop on
Election Infrastructure Security (EIS'22)."

- date: October 3-6, 2022
  headline: "It's time for the 8th International Joint Conference on Electronic
Voting (EVOTE-ID'22)! Our team will be presenting work on initial steps toward
using Dirichlet-Tree models for IRV post-election audits."

- date: May 6, 2022
  headline: "Our work on risk limiting audits for 2-seat STV elections will be
presented today at VOTING'22!"

- date: January 1, 2022
  headline: "This past year our team has explored risk-limiting audit
methodologies for both party-list proportional and Hamiltonian elections. We
have also been successful in our ARC Discovery Project application on post-election
audits for Single Transferable Vote (STV) elections!"

- date: December 24, 2021
  headline: "In an early Christmas present, our team has been awarded an ARC
Discovery Project grant. This project will focus on developing post-election
audit methodologies for Single Transferable Vote (STV) elections."

- date: January 1, 2021
  headline: "Despite the COVID-19 pandemic sending us Melbournians home for the
majority of the year in 2020, this past year has been a busy one on the election
auditing and analysis front. We presented three papers at EVOTE-ID'20, winning a
best paper award for 'You can do RLAs for IRV' summarising the first pilot of
our methodology for risk-limiting audits of IRV elections. Early in the year, we
presented work at IAAI on exploring whether certain mistakes, such as lost ballot
boxes, could have had caused specific candidates to lose a seat in the context
of STV elections."
